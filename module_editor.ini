#------------------------- esp32 + editor -------------------------
[env:esp32-editor]
extends = env:esp32
src_filter = ${platformio.src_filter} +<module_editor/>
build_flags=
	${env.build_flags}
	${env:esp32.build_flags}
	-D DEBUG_EDITOR
lib_deps =
	${env.lib_deps}
	${env:esp32.lib_deps}

#------------------------- esp8266 + editor -------------------------
[env:esp8266-editor]
extends = env:esp8266
src_filter = ${platformio.src_filter} +<module_editor/>
build_flags=
	${env.build_flags}
	${env:esp8266.build_flags}
	-D DEBUG_EDITOR
lib_deps =
	${env.lib_deps}
	${env:esp8266.lib_deps}

#------------------------- registry (автогенерация modules_registry) -------------------------
[registry]
object = module_editor
define = MODULE_EDITOR
web = 1
loop = 0
